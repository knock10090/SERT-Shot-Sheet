const $=id=>document.getElementById(id), view=$('view');let records=[],crew=[],current=null;const fields=[['type','Report type','select',['Training','Operational']],['operationType','Operation type','textarea'],['number','Shot number'],['date','Date','date'],['time','Time','time'],['location','Location'],['targetDescription','Target Description','textarea'],['primary','Primary breacher'],['assistant','Assistant breacher'],['temperature','Temperature (°F)','number'],['weather','Weather','select',['','Dry','Rainy']],['humidity','Humidity','select',['','Low','Medium','High']],['chargeType','Charge type','select',['','Pushing','Blasting','Cutting']],['chargeName','Charge name','text'],['adhesionMethod','Method of adhesion','text'],['primingMethod','Priming method','select',['','Single','Double']],['resultGrains','TOTAL GRAINS','text'],['resultLbs','LBS.','text'],['resultTnt','LBS. TNT','text'],['resultMsd','MSD (FEET)','text'],['resultPsi','INTERIOR OVER PRESSURE (PSI)','text'],['documentedResults','Calculation documentation — additional or previously recorded results','textarea'],["outcomeFunction", "Charge functioned as designed", "select", ["", "Yes", "No"]],["outcomeFunctionNotes", "Charge functioned as designed \u2014 additional comments", "textarea"],["outcomeBreach", "Positive breach", "select", ["", "Yes", "No"]],["outcomeBreachNotes", "Positive breach \u2014 additional comments", "textarea"],["outcomeFragInside", "Hazardous Frag Inside Target", "select", ["", "Yes", "No"]],["outcomeFragInsideNotes", "Hazardous Frag Inside Target \u2014 additional comments", "textarea"],["outcomeFragOutside", "Hazardous Frag Outside Target", "select", ["", "Yes", "No"]],["outcomeFragOutsideNotes", "Hazardous Frag Outside Target \u2014 additional comments", "textarea"],['photos','Photographs taken','select',['Not recorded','Yes','No']],['video','Video taken','select',['Not recorded','Yes','No']],['comments','Administrative comments','textarea']];
function el(tag,txt,parent){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(parent)parent.append(n);return n}function btn(txt,fn,p){let b=el('button',txt,p);b.type='button';b.onclick=fn;return b}function note(t){$('notice').textContent=t}let db=null,sequence=0;function snapshot(){return {records,crew,sequence}}function persist(){if(!db){try{localStorage.setItem('dss-test-v1',JSON.stringify(snapshot()));return true}catch(e){note('Storage unavailable. Export a backup.');return false}}try{let tx=db.transaction('state','readwrite');tx.objectStore('state').put(snapshot(),'main');tx.onabort=()=>note('Storage write failed. Export a backup immediately.');return true}catch(e){note('Storage write failed. Export a backup.');return false}}async function initialize(){try{let d=JSON.parse(localStorage.getItem('dss-test-v1')||'{}');records=d.records||[];crew=d.crew||[];sequence=d.sequence||0}catch(e){}try{db=await new Promise((resolve,reject)=>{let q=indexedDB.open('dss-v04',1);q.onupgradeneeded=()=>q.result.createObjectStore('state');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});let d=await new Promise((resolve,reject)=>{let q=db.transaction('state').objectStore('state').get('main');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(d){records=d.records;crew=d.crew;sequence=d.sequence||0}else persist()}catch(e){db=null;note('Expanded storage unavailable; using browser storage.')}home()}function nextNumber(){let n;do{n='R-'+String(++sequence).padStart(5,'0')}while(records.some(r=>r.number===n));return n}function clone(r){return JSON.parse(JSON.stringify(r))}

function localDate(){let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function autoSave(){if(current.status==='Completed')return;current.status='Draft';records=records.filter(x=>x.id!==current.id);records.push({...current});if(persist())note('Draft automatically saved.');}
function showSupportingImage(a){let d=el('dialog',undefined,document.body);d.className='image-dialog';el('p',a.name||'Supporting image',d);let controls=el('div',undefined,d);controls.className='actions';let scroll=el('div',undefined,d);scroll.className='image-scroll';let img=el('img',undefined,scroll);img.alt=a.name||'Supporting image';img.src=a.data;let zoom=1;function setZoom(n){zoom=Math.max(1,Math.min(4,n));img.style.width=(zoom*100)+'%';out.textContent=Math.round(zoom*100)+'%';}btn('Zoom out',()=>setZoom(zoom-.5),controls);btn('Zoom in',()=>setZoom(zoom+.5),controls);btn('Fit',()=>{setZoom(1);scroll.scrollTop=scroll.scrollLeft=0},controls);let out=el('span','100%',controls);out.setAttribute('aria-live','polite');btn('Close',()=>d.close(),controls);d.onclose=()=>d.remove();setZoom(1);d.showModal()}
function attachmentEditor(s){let r=current;r.attachments=r.attachments||[];el('h2','Approved supporting records',s);el('p','Attach photographs or non-calculation supporting document images for this report. They are stored with the report and included after photographs.',s);let list=el('div',undefined,s);let opened=new Set();function draw(){list.replaceChildren();r.attachments.forEach((a,i)=>{let row=el('details',undefined,list);row.className='support-record';row.open=opened.has(a);el('summary',a.name||'Supporting image '+(i+1),row);row.ontoggle=()=>{if(!row.isConnected)return;if(row.open)opened.add(a);else opened.delete(a)};let im=el('img',undefined,row);im.alt=a.name||'Supporting image';im.src=a.data;im.onclick=()=>showSupportingImage(a);let actions=el('div',undefined,row);actions.className='actions';btn('Enlarge',()=>showSupportingImage(a),actions);let replace=el('input',undefined,row);replace.type='file';replace.accept='image/jpeg,image/png';replace.hidden=true;replace.style.display='none';let rb=btn('Replace',()=>replace.click(),actions);replace.onchange=async()=>{let file=replace.files[0];if(!file)return;rb.disabled=true;try{let data=await compress(file);if(current!==r||!view.contains(s)||!r.attachments.includes(a))return;Object.assign(a,{name:file.name,data});opened.add(a);autoSave();draw()}catch(e){note('Unable to replace image. Original retained.')}finally{replace.value='';rb.disabled=false}};btn('Remove',()=>{let at=r.attachments.indexOf(a);if(at<0)return;r.attachments.splice(at,1);opened.delete(a);autoSave();draw()},actions)})}let l=el('label','Choose supporting record images (JPEG or PNG)',s);let f=el('input',undefined,l);f.type='file';f.accept='image/jpeg,image/png';f.multiple=true;f.onchange=async()=>{f.disabled=true;try{for(let file of f.files){if(r.attachments.length>=12){note('Maximum 12 supporting images per report.');break}let data=await compress(file);if(current!==r||!view.contains(s))break;let a={name:file.name,data};r.attachments.push(a);opened.add(a);autoSave();draw()}}catch(e){note('Unable to attach image.')}finally{f.value='';f.disabled=false}};draw()}
function photoEditor(s){current.images=current.images||[];let r=current;el('h2','Photograph attachments',s);el('p','Photos appear on separate pages at the end of the printable report. Images are compressed for local storage.',s);let list=el('div',undefined,s);function draw(){list.replaceChildren();r.images.forEach((img,i)=>{let box=el('div',undefined,list);box.className='record';let pic=el('img',undefined,box);pic.className='preview';pic.src=img.data;let l=el('label','Photo '+(i+1)+' caption',box);let t=el('textarea',undefined,l);t.value=img.caption||'';t.oninput=()=>{img.caption=t.value;autoSave()};btn('Remove photo',()=>{r.images.splice(i,1);autoSave();draw()},box);for(let [label,delta] of [['Move up',-1],['Move down',1]]){let b=btn(label,()=>{let j=i+delta;[r.images[i],r.images[j]]=[r.images[j],r.images[i]];autoSave();draw()},box);b.disabled=i+delta<0||i+delta>=r.images.length}btn('Enlarge',()=>{let w=el('dialog',undefined,document.body);let im=el('img',undefined,w);im.src=img.data;im.style.maxWidth='100%';btn('Close',()=>w.close(),w);w.onclose=()=>w.remove();w.showModal()},box)})}for(let camera of [false,true]){let l=el('label',camera?'Take photograph':'Choose photographs',s);let input=el('input',undefined,l);input.type='file';input.accept='image/*';if(camera)input.setAttribute('capture','environment');else input.multiple=true;input.onchange=async()=>{input.disabled=true;for(let f of Array.from(input.files)){if(r.images.length>=12){note('Maximum 12 photos per report.');break}try{let data=await compress(f);if(current!==r||!view.contains(s))break;r.images.push({data,caption:''});autoSave();draw()}catch(e){note('Could not read photo. Try a JPEG or PNG.')}}input.value='';input.disabled=false}}draw()}
async function compress(f){let url=URL.createObjectURL(f);try{let im=new Image();im.src=url;await im.decode();let scale=Math.min(1,1200/Math.max(im.width,im.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.65)}finally{URL.revokeObjectURL(url)}}
function backup(){view.replaceChildren();let s=el('section',undefined,view);el('h2','Backup and recovery',s);el('p','Backups contain unencrypted reports, personnel and photos. Use test data only. Restore replaces all current records.',s);btn('Export backup',()=>{let blob=new Blob([JSON.stringify({version:4,records,crew,sequence})],{type:'application/json'});let a=el('a');a.href=URL.createObjectURL(blob);a.download='shot-sheet-backup-'+localDate()+'.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)},s);let l=el('label','Restore backup file',s);let i=el('input',undefined,l);i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!Array.isArray(d.records)||!Array.isArray(d.crew)||!d.crew.every(n=>typeof n==='string'))throw Error();let ids=new Set();for(let r of d.records){if(!r||typeof r.id!=='string'||ids.has(r.id)||!['Draft','Completed'].includes(r.status))throw Error();ids.add(r.id);for(let [k] of fields)if(r[k]!=null&&typeof r[k]!=='string')throw Error();if(r.attachments&&(!Array.isArray(r.attachments)||!r.attachments.every(a=>a&&typeof a.name==='string'&&typeof a.data==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(a.data))))throw Error();if(r.images&&(!Array.isArray(r.images)||!r.images.every(x=>x&&typeof x.data==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(x.data)&&typeof x.caption==='string')))throw Error()}if(!confirm('Replace all existing reports and personnel with this backup?'))return;let oldR=records,oldC=crew;records=d.records;crew=d.crew;sequence=Math.max(sequence,Number(d.sequence)||0);if(!persist()){records=oldR;crew=oldC;return}current=null;note('Backup restored.');home()}catch(e){note('Invalid or unreadable backup. Existing records unchanged.')}finally{i.value=''}}}

function home(){view.replaceChildren();let s=el('section',undefined,view);el('h2','Report dashboard',s);el('p',records.filter(r=>r.status==='Completed').length+' completed · '+records.filter(r=>r.status==='Draft').length+' drafts',s);btn('Create report',()=>edit(),s);el('p','Test build: use fictitious information only. Browser storage is not encrypted and can be cleared.',s)}
function edit(r){if(r&&r.status==='Completed'){printReport(r);return}current=r?clone(r):{id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),type:'Training',number:nextNumber(),date:localDate(),status:'Draft'};view.replaceChildren();let s=el('section',undefined,view);el('h2','Report entry',s);let form=el('form',undefined,s);form.onsubmit=e=>e.preventDefault();for(let [key,title,type,opts] of fields){if(key==='outcomeFunction')el('h2','Results documentation',form);if(key==='chargeType'){el('h2','Charge documentation',form);el('p','Record previously completed activities only.',form)}if(key==='resultGrains'){el('h2','Calculation documentation',form);el('p','Record independently completed results only. No calculations or safety checks are performed.',form)}let l=el('label',key==='number'?numberHeading(current):title,form);if(key==='number')l.dataset.numberHeading='';const subtitle={resultLbs:'Enter independently calculated weight in pounds',resultTnt:'Enter independently calculated TNT equivalent',resultMsd:'Enter independently calculated minimum safe distance'}[key];if(subtitle){let hint=el('small',subtitle,l);hint.style.display='block';hint.style.color='#3b4628';hint.style.marginTop='5px'}let i=el(type==='select'?'select':type==='textarea'?'textarea':'input',undefined,l);if(type==='select'){for(let v of opts){let o=el('option',v||'Select',i);o.value=v}}else if(type!=='textarea'){i.type=type||'text';if(['primary','assistant'].includes(key)){i.setAttribute('list','names')}}if(key==='targetDescription')i.placeholder='Door type, residence type, etc.';if(key.startsWith('result')){i.placeholder='Enter completed result';l.style.border='1px solid #c5b59b';l.style.padding='12px';l.style.borderRadius='8px'}if(key==='documentedResults'){i.placeholder='Record completed results and units only. No calculations are performed.';l.style.border='1px solid #c5b59b';l.style.padding='12px';l.style.borderRadius='8px'}i.value=current[key]??(type==='select'?opts[0]:'');current[key]=i.value;if(key.startsWith('outcome')&&key.endsWith('Notes')){l.dataset.outcomeNotes=key.slice(0,-5);l.hidden=current[l.dataset.outcomeNotes]!==outcomeCommentTrigger(l.dataset.outcomeNotes);l.style.display=l.hidden?'none':'block';i.disabled=l.hidden}if(key==='operationType'){l.dataset.operationType='';i.placeholder='Examples: Warrant service, barricade, Hostage rescue, and other';l.hidden=current.type!=='Operational';l.style.display=l.hidden?'none':'block';i.disabled=l.hidden}i.oninput=()=>{current[key]=i.value;if(key==='type'){let heading=form.querySelector('[data-number-heading]');if(heading)heading.firstChild.nodeValue=numberHeading(current);let n=form.querySelector('[data-operation-type]');if(n){n.hidden=i.value!=='Operational';n.style.display=n.hidden?'none':'block';n.querySelector('textarea').disabled=n.hidden}}if(key.startsWith('outcome')&&!key.endsWith('Notes')){let n=form.querySelector('[data-outcome-notes="'+key+'"]');if(n){n.hidden=i.value!==outcomeCommentTrigger(key);n.style.display=n.hidden?'none':'block';n.querySelector('textarea').disabled=n.hidden}}autoSave()}}let dl=el('datalist',undefined,form);dl.id='names';crew.forEach(n=>{let o=el('option',undefined,dl);o.value=n});btn('Validate entries',()=>{let missing=['number','date','location','primary'].filter(k=>!String(current[k]||'').trim());note(missing.length?'Missing administrative fields: '+missing.map(k=>k==='number'?numberHeading(current):fields.find(f=>f[0]===k)[1]).join(', '):'Administrative fields present. No safety assessment performed.');},form);attachmentEditor(s);photoEditor(s);let a=el('div',undefined,s);a.className='actions';btn('Save draft',()=>save('Draft'),a);btn('Complete report',()=>{if(!current.number||!current.location||!current.primary){note('Enter '+numberHeading(current).toLowerCase()+', location and primary breacher.');return}if(confirm('Finalize and lock this report?'))save('Completed')},a);btn('Print / PDF preview',()=>printReport(current),a)}
function save(status){current.status=status;records=records.filter(r=>r.id!==current.id);records.push({...current});let ok=persist();library();note(ok?'Report saved on this browser.':'Report retained temporarily only.')}
function library(){view.replaceChildren();let s=el('section',undefined,view);el('h2','Report library',s);let q=el('input',undefined,s);q.placeholder='Search reports';let filters={};for(let [k,t,ty] of [['date','Date','date'],['location','Location','text'],['person','Personnel','text'],['number','Report number','text']]){let l=el('label',t,s);let f=el('input',undefined,l);f.type=ty;f.oninput=draw;filters[k]=f}let list=el('div',undefined,s);function draw(){list.replaceChildren();for(let r of records.filter(r=>reportFields(r).map(([k])=>r[k]||'').join(' ').toLowerCase().includes(q.value.toLowerCase())&&Object.entries(filters).every(([k,f])=>!f.value||String(k==='person'?(r.primary||'')+' '+(r.assistant||''):r[k]||'').toLowerCase().includes(f.value.toLowerCase()))).reverse()){let row=el('div',undefined,list);row.className='record';el('strong',(r.type==='Operational'?'Incident ':'Shot ')+(r.number||'Unassigned')+' · '+r.status,row);el('p',(r.date||'')+' · '+(r.location||''),row);let a=el('div',undefined,row);a.className='actions';btn(r.status==='Completed'?'View locked report':'Open',()=>edit(r),a);btn('Duplicate',()=>{let n=clone(r);n.id=crypto.randomUUID();n.number=nextNumber();n.date=localDate();n.status='Draft';n.images=[];n.attachments=[];n.reference='';n.verifiedBy='';n.comments='';n.operationType='';n.documentedResults='';for(let [k] of fields)if(k.startsWith('result')||k.startsWith('outcome'))n[k]='';edit(n);autoSave()},a);btn('Print',()=>printReport(r),a);if(r.status!=='Completed')btn('Delete',()=>{if(confirm('Delete this report?')){records=records.filter(x=>x.id!==r.id);persist();draw()}},a)}if(!list.children.length)el('p','No matching reports.',list)}q.oninput=draw;draw()}
function personnel(){view.replaceChildren();let s=el('section',undefined,view);el('h2','Personnel roster',s);let i=el('input',undefined,s);i.placeholder='Name';btn('Add person',()=>{let n=i.value.trim();if(n&&!crew.includes(n)){crew.push(n);persist();personnel()}},s);for(let n of crew){let p=el('p',n+' ',s);btn('Edit',()=>{let v=prompt('Edit roster name',n);if(v&&v.trim()&&!crew.includes(v.trim())){crew=crew.map(x=>x===n?v.trim():x);persist();personnel()}},p);btn('Remove',()=>{crew=crew.filter(x=>x!==n);persist();personnel()},p)}}
function outcomeCommentTrigger(key){return (key==='outcomeFunction'||key==='outcomeBreach')?'No':'Yes'}
function numberHeading(r){return r.type==='Operational'?'Incident Number':'Shot Number'}
function reportFields(r){return fields.filter(([k])=>(k!=='operationType'||r.type==='Operational')&&(!(k.startsWith('outcome')&&k.endsWith('Notes'))||r[k.slice(0,-5)]===outcomeCommentTrigger(k.slice(0,-5)))).map(f=>f[0]==='number'?[f[0],numberHeading(r),...f.slice(2)]:f)}
function printReport(r){let p=$('print');p.replaceChildren();let tools=el('div',undefined,p);tools.className='preview-tools';btn('Back to report',()=>{document.body.classList.remove('previewing');p.replaceChildren()},tools);let print=btn('Print',()=>{try{window.print()}catch(e){alert('Printing unavailable. Open the app in Safari and try again.')}},tools);let pdf=btn('Generate PDF',async()=>{pdf.disabled=true;pdf.textContent='Generating…';try{let blob=await makeReportPDF(r);let name='shot-sheet-'+String(r.number||'report').replace(/[^a-zA-Z0-9_-]/g,'_')+'.pdf';let file=new File([blob],name,{type:'application/pdf'});let url=URL.createObjectURL(blob);let panel=el('div',undefined,tools);panel.style.color='white';el('p','PDF ready. Choose Share PDF or Download PDF.',panel);if(navigator.canShare&&navigator.canShare({files:[file]}))btn('Share PDF',()=>navigator.share({files:[file]}).catch(e=>{if(e.name!=='AbortError')alert('Sharing failed. Try Download PDF.')}),panel);let a=el('a','Download PDF',panel);a.href=url;a.download=name;a.style.cssText='display:inline-block;color:#182018;padding:12px';let open=el('a','Open PDF',panel);open.href=url;open.target='_blank';open.rel='noopener';open.style.cssText='display:inline-block;color:#182018;padding:12px';pdf.textContent='Generate PDF';}catch(e){alert('PDF generation failed. Check photographs and retry.');pdf.textContent='Generate PDF'}finally{pdf.disabled=false}},tools);el('h2','PENNSYLVANIA STATE POLICE BREACHER’S REPORT',p);el('p','ADMINISTRATIVE TEST REPORT — NOT OFFICIAL FORM',p);for(let [k,t] of reportFields(r))el('p',t+': '+(r[k]||'—'),p);for(let [idx,img] of (r.images||[]).entries()){let page=el('div',undefined,p);page.className='photo-page';el('h2','Photograph '+(idx+1)+' — Report '+(r.number||'Unassigned'),page);let pic=el('img',undefined,page);pic.src=img.data;el('p',img.caption||'No caption',page)}for(let a of (r.attachments||[])){let page=el('div',undefined,p);page.className='photo-page';el('h2','Supporting document: '+a.name,page);let im=el('img',undefined,page);im.src=a.data}document.body.classList.add('previewing');window.scrollTo(0,0);print.disabled=true;Promise.all(Array.from(p.querySelectorAll('img')).map(i=>i.decode().catch(()=>{}))).then(()=>{print.disabled=false})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{note('');({home,edit:()=>edit(),library,crew:personnel,backup})[b.dataset.view]()});document.querySelectorAll('nav button').forEach(b=>b.disabled=true);initialize().finally(()=>document.querySelectorAll('nav button').forEach(b=>b.disabled=false));if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
